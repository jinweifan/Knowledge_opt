[project]
name = "knowledge-opt"
version = "0.1.0"
description = "客服回复幻觉检测：Chroma + LangGraph + DeepSeek"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=0.3.0,<1.0",
    "langchain-openai>=0.3.0,<1.0",
    "langchain-community>=0.3.0,<0.4",
    "langchain-chroma>=0.2.0,<1.0",
    "langchain-huggingface>=0.1.0,<1.0",
    "langgraph>=0.2.0,<1.0",
    "chromadb>=0.5.0,<1.1",
    "sentence-transformers>=3.0.0,<6",
    "numpy>=1.24.0,<3",
    "protobuf>=4.25.0,<6",
    "torch>=2.2.0",
    "matplotlib>=3.8.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb", "cli"]

[tool.uv]
package = false

# 默认装 CPU 版 torch，避免拉数百 MB NVIDIA wheel
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# 与 .cursor/rules/python-pep8.mdc 对齐；Agent/本地可用 ruff check & ruff format
[tool.ruff]
target-version = "py311"
line-length = 88
src = [".", "kb", "cli"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # 由 formatter 管行宽；长字符串/提示词允许超长
]

[tool.ruff.lint.isort]
known-first-party = ["kb", "cli"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
